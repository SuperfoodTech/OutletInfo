services:
  # Layanan Bot Utama: Menjalankan Bot Listing (/listing) & Bot SOT (/sot) dalam 1 Container Tunggal
  bot:
    build: .
    container_name: outlet-info-bot
    command: python bot_unified.py
    restart: unless-stopped
    network_mode: host
    shm_size: '1gb'
    mem_limit: 1500m
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - HEADLESS_GOFOOD=true
      - HEADLESS_GRAB=true
      - HEADLESS_SHOPEE=true
    volumes:
      - ./.env:/app/.env:ro
      - ./export_and_upload_drive.py:/app/export_and_upload_drive.py
      - ./discord_bot.py:/app/discord_bot.py
      - ./bot_listing.py:/app/bot_listing.py
      - ./bot_sot.py:/app/bot_sot.py
      - ./bot_unified.py:/app/bot_unified.py
      - ./pipeline_lock.py:/app/pipeline_lock.py
      - ./GOFOOD:/app/GOFOOD
      - ./GRAB:/app/GRAB
      - ./SHOPEE:/app/SHOPEE
      - ./cronjobsot:/app/cronjobsot
      - ./output_owners:/app/output_owners
      - ./cache:/app/cache

  # Service individu di bawah ini disetel restart: "no" untuk mencegah OOM ganda.
  bot-listing:
    build: .
    container_name: outlet-info-bot-listing
    command: python bot_listing.py
    restart: "no"
    network_mode: host
    shm_size: '1gb'
    mem_limit: 1500m
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - HEADLESS_GOFOOD=true
      - HEADLESS_GRAB=true
      - HEADLESS_SHOPEE=true
    volumes:
      - ./.env:/app/.env:ro
      - ./export_and_upload_drive.py:/app/export_and_upload_drive.py
      - ./discord_bot.py:/app/discord_bot.py
      - ./bot_listing.py:/app/bot_listing.py
      - ./bot_sot.py:/app/bot_sot.py
      - ./bot_unified.py:/app/bot_unified.py
      - ./pipeline_lock.py:/app/pipeline_lock.py
      - ./GOFOOD:/app/GOFOOD
      - ./GRAB:/app/GRAB
      - ./SHOPEE:/app/SHOPEE
      - ./cronjobsot:/app/cronjobsot
      - ./output_owners:/app/output_owners
      - ./cache:/app/cache

  bot-sot:
    build: .
    container_name: outlet-info-bot-sot
    command: python bot_sot.py
    restart: "no"
    network_mode: host
    shm_size: '1gb'
    mem_limit: 1500m
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - HEADLESS_GOFOOD=true
      - HEADLESS_GRAB=true
      - HEADLESS_SHOPEE=true
    volumes:
      - ./.env:/app/.env:ro
      - ./export_and_upload_drive.py:/app/export_and_upload_drive.py
      - ./discord_bot.py:/app/discord_bot.py
      - ./bot_listing.py:/app/bot_listing.py
      - ./bot_sot.py:/app/bot_sot.py
      - ./bot_unified.py:/app/bot_unified.py
      - ./pipeline_lock.py:/app/pipeline_lock.py
      - ./GOFOOD:/app/GOFOOD
      - ./GRAB:/app/GRAB
      - ./SHOPEE:/app/SHOPEE
      - ./cronjobsot:/app/cronjobsot
      - ./output_owners:/app/output_owners
      - ./cache:/app/cache

  weekly-sync:
    build: .
    container_name: outlet-info-weekly-sync
    command: python cronjobsot/weekly_batch_sync.py
    restart: "no"
    network_mode: host
    shm_size: '1gb'
    mem_limit: 1800m
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - HEADLESS_GOFOOD=true
      - HEADLESS_GRAB=true
      - HEADLESS_SHOPEE=true
    volumes:
      - ./.env:/app/.env:ro
      - ./export_and_upload_drive.py:/app/export_and_upload_drive.py
      - ./discord_bot.py:/app/discord_bot.py
      - ./bot_listing.py:/app/bot_listing.py
      - ./bot_sot.py:/app/bot_sot.py
      - ./pipeline_lock.py:/app/pipeline_lock.py
      - ./GOFOOD:/app/GOFOOD
      - ./GRAB:/app/GRAB
      - ./SHOPEE:/app/SHOPEE
      - ./cronjobsot:/app/cronjobsot
      - ./output_owners:/app/output_owners
      - ./cache:/app/cache

  cli:
    build: .
    container_name: outlet-info-cli
    command: python cli.py
    stdin_open: true
    tty: true
    network_mode: host
    shm_size: '1gb'
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - HEADLESS_GOFOOD=true
      - HEADLESS_GRAB=true
      - HEADLESS_SHOPEE=true
    volumes:
      - ./.env:/app/.env:ro
      - ./SHOPEE/data:/app/SHOPEE/data
      - ./SHOPEE/credentials.json:/app/SHOPEE/credentials.json
      - ./GRAB/sessions:/app/GRAB/sessions
      - ./GOFOOD/session:/app/GOFOOD/session
      - ./output_owners:/app/output_owners
      - ./cronjobsot/reports:/app/cronjobsot/reports
      - ./cache:/app/cache
